<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Properties | PropertyPro</title>

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <link rel="stylesheet"
          href="css/style.css">

</head>

<body>


<!-- NAVBAR -->

<header class="home-navbar">

    <div class="home-logo">

        <i class="fa-solid fa-building"></i>

        <span>PropertyPro</span>

    </div>


    <nav class="home-nav">

        <a href="index.html">
            Home
        </a>

        <a href="public-properties.html">
            Properties
        </a>

        <a href="index.html#about">
            About
        </a>

        <a href="index.html#contact">
            Contact
        </a>

    </nav>

</header>


<!-- PAGE -->

<section class="featured-section">

    <div class="section-heading">

        <div>

            <p class="section-tag">
                OUR PROPERTIES
            </p>

            <h2>
                Available Properties
            </h2>

            <p>
                Find the perfect property for you.
            </p>

        </div>

    </div>


    <!-- SEARCH -->

    <div class="filter-box">

        <div class="search-box">

            <i class="fa-solid fa-magnifying-glass"></i>

            <input
                type="text"
                id="publicSearch"
                placeholder="Search by location..."
                onkeyup="displayPublicProperties()">

        </div>


        <select
            id="publicTypeFilter"
            onchange="displayPublicProperties()">

            <option value="">
                All Types
            </option>

            <option value="House">
                House
            </option>

            <option value="Apartment">
                Apartment
            </option>

            <option value="Villa">
                Villa
            </option>

            <option value="Office">
                Office
            </option>

            <option value="Shop">
                Shop
            </option>

        </select>

    </div>


    <!-- PROPERTIES -->

    <div
        id="publicPropertyContainer"
        class="featured-grid">

    </div>

</section>


<!-- SCRIPTS -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="js/supabase.js"></script>

<script src="js/public-properties.js"></script>

</body>

</html>
